[supervisord]
nodaemon=true
user=root

[program:telegram-bot-api]
command=bash -c "mkdir -p /data/tgbotapi/tmp && exec /usr/local/bin/telegram-bot-api \
    --local \
    --http-port=8081 \
    --dir=/data/tgbotapi \
    --temp-dir=/data/tgbotapi/tmp \
    --api-id=%(ENV_TELEGRAM_API_ID)s \
    --api-hash=%(ENV_TELEGRAM_API_HASH)s"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bot]
command=python bot.py
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; telegram-bot-api ishga tushishini biroz kutamiz
startsecs=3
