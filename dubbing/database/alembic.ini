; dubbing/database/alembic.ini
;
; Bu Alembic konfiguratsiyasi FAQAT dubbing bazasi uchun. `sqlalchemy.url`
; qiymati env.py ichida DUBBING_DATABASE_URL bilan almashtiriladi va
; env.py boshqa har qanday DSN'ga qarshi ishlashni rad etadi (xavfsizlik
; to'sig'i sifatida) — shuning uchun bu yerdagi placeholder qiymat
; ishlatilmaydi, lekin Alembic uni talab qiladi.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
sqlalchemy.url = postgresql://placeholder:placeholder@localhost/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
